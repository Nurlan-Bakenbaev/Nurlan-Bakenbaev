<svg xmlns="http://www.w3.org/2000/svg" width="900" height="335" viewBox="0 0 900 335" role="img" aria-label="Animated cybersecurity terminal with connected network nodes and live logs">
 <defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#060d1b"/><stop offset="1" stop-color="#0c2633"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#00e5ff" stop-opacity="0"/><stop offset=".5" stop-color="#00e5ff" stop-opacity=".11"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 </defs>
 <rect x="2" y="2" width="896" height="331" rx="17" fill="url(#bg)" stroke="#174d63" stroke-width="2"/>
 <path d="M2 51H898" stroke="#174d63"/>
 <circle cx="28" cy="27" r="6" fill="#ff5f57"/><circle cx="48" cy="27" r="6" fill="#febc2e"/><circle cx="68" cy="27" r="6" fill="#28c840"/>
 <text x="450" y="32" font-family="monospace" font-size="14" fill="#9fc9da" text-anchor="middle">SECURITY OPERATIONS  //  INFRASTRUCTURE CONSOLE</text>
 <g font-family="monospace" font-size="14">
  <text x="30" y="83" fill="#1ee8b5">admin@infrastructure</text><text x="218" y="83" fill="#d2eef6">:~$ systemctl status security</text>
  <text x="30" y="115" fill="#75a5b5">● server-health.service</text><text x="267" y="115" fill="#1ee8b5">ACTIVE</text>
  <text x="30" y="143" fill="#75a5b5">● firewall-policy.service</text><text x="267" y="143" fill="#1ee8b5">ENABLED</text>
  <text x="30" y="171" fill="#75a5b5">● audit-logging.service</text><text x="267" y="171" fill="#1ee8b5">RUNNING</text>
  <text x="30" y="213" fill="#d2eef6">[INFO] Network connectivity</text><text x="284" y="213" fill="#1ee8b5">OK</text>
  <text x="30" y="240" fill="#d2eef6">[INFO] Access review</text><text x="284" y="240" fill="#1ee8b5">READY</text>
  <text x="30" y="267" fill="#d2eef6">[INFO] Monitoring pipeline</text><text x="284" y="267" fill="#1ee8b5">ONLINE</text>
  <text x="30" y="307" fill="#1ee8b5">admin@infrastructure</text><text x="218" y="307" fill="#d2eef6">:~$</text>
  <rect x="259" y="293" width="9" height="16" fill="#00e5ff"><animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
 </g>
 <path d="M558 116L671 172L789 105M671 172L783 245M558 116L557 245M557 245L671 172" fill="none" stroke="#1d7082" stroke-width="2" stroke-dasharray="5 7"/>
 <g fill="#071c2a" stroke="#00d9f5" stroke-width="2" filter="url(#glow)">
  <circle cx="558" cy="116" r="23"/><circle cx="671" cy="172" r="30"/><circle cx="789" cy="105" r="24"/><circle cx="557" cy="245" r="23"/><circle cx="783" cy="245" r="23"/>
 </g>
 <g font-family="monospace" fill="#9aeeff" font-size="10" text-anchor="middle">
  <text x="558" y="119">DNS</text><text x="671" y="175">CORE</text><text x="789" y="108">FW</text><text x="557" y="248">SRV</text><text x="783" y="248">LOG</text>
 </g>
 <g fill="#00ffd1" filter="url(#glow)">
  <circle r="4"><animateMotion dur="2.7s" repeatCount="indefinite" path="M558 116L671 172L789 105"/></circle>
  <circle r="4"><animateMotion dur="3.1s" repeatCount="indefinite" path="M557 245L671 172L783 245"/></circle>
 </g>
 <circle cx="671" cy="172" r="42" fill="none" stroke="#19ebce" opacity=".7"><animate attributeName="r" values="32;55;32" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".65;0;.65" dur="3s" repeatCount="indefinite"/></circle>
 <text x="671" y="297" font-size="12" font-family="monospace" text-anchor="middle" fill="#77acbb">LIVE NETWORK TOPOLOGY</text>
 <rect x="3" y="53" width="894" height="35" fill="url(#scan)" opacity=".5"><animate attributeName="y" values="53;296;53" dur="7s" repeatCount="indefinite"/></rect>
</svg>